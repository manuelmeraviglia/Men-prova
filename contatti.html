<!DOCTYPE html>

<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bar Centrale | Contatti & Orari</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="components/navigation/navigation.css">
  <link rel="stylesheet" href="components/site-header/site-header.css">
  <link rel="stylesheet" href="components/footer/footer.css">

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #f8f4ef;
      color: #171717;
      font-family: "Montserrat", sans-serif;
    }

    .page {
      max-width: 650px;
      margin: auto;
      padding: 130px 25px 80px;
      text-align: center;
    }

    h1 {
      font-family: "Playfair Display", serif;
      font-size: 48px;
      font-weight: 400;
      letter-spacing: 3px;
      margin-bottom: 50px;
    }

    .section-title {
      font-family: "Playfair Display", serif;
      font-size: 13px;
      letter-spacing: 4px;
      text-transform: uppercase;
      opacity: 0.5;
      margin-bottom: 16px;
    }

    .phone {
      font-family: "Playfair Display", serif;
      font-size: 28px;
      font-weight: 400;
      margin-bottom: 60px;
    }

    .phone a {
      color: #171717;
      text-decoration: none;
    }

    .phone a:hover {
      opacity: 0.65;
    }

    .hours-table {
      width: 100%;
      max-width: 380px;
      margin: 0 auto;
      border-collapse: collapse;
    }

    .hours-table tr {
      border-bottom: 1px solid rgba(23, 23, 23, 0.08);
    }

    .hours-table tr:last-child {
      border-bottom: none;
    }

    .hours-table td {
      padding: 13px 8px;
      font-family: "Montserrat", sans-serif;
      font-size: 15px;
    }

    .hours-table td:first-child {
      text-align: left;
      font-weight: 500;
    }

    .hours-table td:last-child {
      text-align: right;
      opacity: 0.75;
    }

    .closed {
      color: #b04040;
      font-weight: 500;
      opacity: 1 !important;
    }

    @media (max-width: 700px) {

      .nav {
        padding: 20px;
      }

      .navigation {
        top: 78px;
        right: 20px;
      }

      .page {
        padding-top: 110px;
      }

      h1 {
        font-size: 36px;
        margin-bottom: 40px;
      }

      .phone {
        font-size: 24px;
      }

      .hours-table td {
        font-size: 14px;
      }

    }

  </style>

</head>

<body>

  <div id="nav-container"></div>
  <script src="components/navigation/navigation.js"></script>

  <main class="page">

    <div id="site-header-container"></div>
    <script src="components/site-header/site-header.js"></script>

    <p class="section-title">Telefono</p>
    <p class="phone">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;margin-right:8px;opacity:0.7"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.6 1.18h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.77a16 16 0 0 0 6.29 6.29l.96-.96a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7a2 2 0 0 1 1.72 2.02z"/></svg><a href="tel:0293730738">02 937 3073</a>
    </p>

    <p class="section-title">Orari di apertura</p>
    <table class="hours-table">
      <tbody>
        <tr>
          <td>Lunedì</td>
          <td>7:00 – 20:00</td>
        </tr>
        <tr>
          <td>Martedì</td>
          <td>7:00 – 20:00</td>
        </tr>
        <tr>
          <td>Mercoledì</td>
          <td>7:00 – 20:00</td>
        </tr>
        <tr>
          <td>Giovedì</td>
          <td>7:00 – 20:00</td>
        </tr>
        <tr>
          <td>Venerdì</td>
          <td>7:00 – 20:00</td>
        </tr>
        <tr>
          <td>Sabato</td>
          <td class="closed">Chiuso</td>
        </tr>
        <tr>
          <td>Domenica</td>
          <td>7:30 – 20:00</td>
        </tr>
      </tbody>
    </table>

  </main>

  <div id="footer-container"></div>
  <script src="components/footer/footer.js"></script>

</body>
</html>
