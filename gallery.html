<!-- Gallery section with images-->

<!doctype html>

<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Bar Centrale | Gallery</title>

    <link rel="stylesheet" href="global_styles.css" />

    <link rel="stylesheet" href="components/navigation/navigation.css" />
    <link rel="stylesheet" href="components/site-header/site-header.css" />
    <link rel="stylesheet" href="components/footer/footer.css" />

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        background: #f8f4ef;
        color: #171717;
      }

      .page {
        max-width: 920px;
        margin: auto;
        padding: 130px 25px 80px;
        text-align: center;
      }

      h1 {
        margin-bottom: 25px;
      }

      .gallery-intro {
        max-width: 620px;
        margin: 0 auto 32px;
        font-family: "Playfair Display", serif;
        font-size: 22px;
        line-height: 1.7;
      }

      .image-slider {
        margin: 0 auto 28px;
      }

      @media (max-width: 700px) {
        .nav {
          padding: 20px;
        }

        .navigation {
          top: 78px;
          right: 20px;
        }

        .page {
          padding-top: 110px;
        }

        .gallery-intro {
          font-size: 19px;
        }
      }
    </style>
  </head>

  <body>
    <div id="nav-container"></div>
    <script src="components/navigation/navigation.js"></script>

    <main class="page">
      <div id="site-header-container"></div>
      <script src="components/site-header/site-header.js"></script>

      <p class="gallery-intro">
        Uno sguardo al nostro spazio, al nostro caffè e all'atmosfera che ci
        accompagna ogni giorno.
      </p>

      <div id="image-slider-container"></div>
      <script src="components/image-slider/image-slider.js"></script>
    </main>

    <div id="footer-container"></div>
    <script src="components/footer/footer.js"></script>
  </body>
</html>
